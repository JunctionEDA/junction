name: release

# One release run: build macOS, Windows and Linux, launch every build on a
# clean machine and screenshot it, then create the vX.Y.Z tag and the GitHub
# release with the three downloads.  The version is packaging/VERSION and the
# notes are its section of CHANGELOG.md.  A run from the Actions tab makes a
# draft unless "draft" is unticked; publish-release.yml publishes a draft.
# A build that already passed in another run (a per-platform workflow run, or
# an earlier release run) can be reused by its run id; it is still
# launch-tested here before the release is made.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      linux_run:
        description: "Reuse the Linux tarball from this workflow run id instead of building (optional)"
        default: ""
      windows_run:
        description: "Reuse the Windows installer from this workflow run id instead of building (optional)"
        default: ""
      macos_run:
        description: "Reuse the macOS DMG from this workflow run id instead of building (optional)"
        default: ""
  push:
    tags: ["v*"]

jobs:
  linux:
    if: ${{ !inputs.linux_run }}
    uses: ./.github/workflows/linux-build.yml
  windows:
    if: ${{ !inputs.windows_run }}
    uses: ./.github/workflows/windows-installer.yml
  macos:
    if: ${{ !inputs.macos_run }}
    uses: ./.github/workflows/macos-build.yml

  test-linux:
    needs: linux
    if: ${{ always() && (needs.linux.result == 'success' || inputs.linux_run) }}
    permissions:
      actions: read
    uses: ./.github/workflows/launch-tests.yml
    with:
      platform: linux
      run: ${{ inputs.linux_run }}

  test-windows:
    needs: windows
    if: ${{ always() && (needs.windows.result == 'success' || inputs.windows_run) }}
    permissions:
      actions: read
    uses: ./.github/workflows/launch-tests.yml
    with:
      platform: windows
      run: ${{ inputs.windows_run }}

  test-macos:
    needs: macos
    if: ${{ always() && (needs.macos.result == 'success' || inputs.macos_run) }}
    permissions:
      actions: read
    uses: ./.github/workflows/launch-tests.yml
    with:
      platform: macos
      run: ${{ inputs.macos_run }}

  release:
    needs: [test-linux, test-windows, test-macos]
    if: ${{ always() && needs.test-linux.result == 'success' && needs.test-windows.result == 'success' && needs.test-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: junction-linux
          path: dl
          run-id: ${{ inputs.linux_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: junction-windows-installer
          path: dl
          run-id: ${{ inputs.windows_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: junction-macos
          path: dl
          run-id: ${{ inputs.macos_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: launch-*
          path: launch
      - name: Keep the launch screenshots on the launch-screenshots branch
        # One commit, replaced by every release run, so the screenshots can be
        # looked at with git before a draft is published.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < packaging/VERSION)
          cd launch
          git init -q -b launch-screenshots
          git add -A
          git -c user.name="Nathan" -c user.email="70660308+notaroomba@users.noreply.github.com" \
            commit -q -m "Launch screenshots of Junction $VERSION (release run $GITHUB_RUN_ID)"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" HEAD:refs/heads/launch-screenshots
          cd .. && rm -rf launch
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          VERSION=$(tr -d '[:space:]' < packaging/VERSION)
          TAG=v$VERSION
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaging/VERSION $VERSION"; exit 1
          fi
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## "v"( |$)" { on=1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          find dl -type f -exec ls -la {} +
          flags=""
          [ "$DRAFT" = true ] && flags="--draft"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Junction $VERSION" \
            --notes-file notes.md $flags \
            "$(find dl -name "Junction-$VERSION-macos.dmg" | head -1)" \
            "$(find dl -name "Junction-$VERSION-windows-x64.exe" | head -1)" \
            "$(find dl -name "Junction-$VERSION-linux-x64.tar.gz" | head -1)"
