<!doctype html>
<!-- The demo video as a page: a 1920 x 1080 stage whose contents are a function of time.
     render.mjs loads it, hands it the timeline (window.load) and asks for one frame after another
     (window.seek).  Footage is the photographs record.mjs took; this page only frames and captions them. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0b0b0c; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; color: #ededed;
           font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .win { position: absolute; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px #2a2a2d; background: #111; }
  .win img { display: block; width: 100%; height: 100%; }
  .who { position: absolute; top: 34px; font-size: 22px; color: #9a9a9f; }
  #caption { position: absolute; left: 160px; bottom: 44px; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; opacity: 0; }
  #speed { position: absolute; right: 160px; bottom: 48px; font-size: 22px; color: #8a8a90; font-variant-numeric: tabular-nums; opacity: 0; }
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card h1 { font-size: 96px; font-weight: 600; letter-spacing: -0.03em; margin: 28px 0 0; }
  .card p { font-size: 34px; color: #a8a8ad; margin: 18px 0 0; }
  .card code { font-family: "DejaVu Sans Mono", monospace; font-size: 28px; color: #d0d0d4; margin-top: 44px; }
  .card svg, .card img.icon { width: 150px; height: 150px; }
  .prompt { position: absolute; left: 360px; top: 330px; width: 1120px; padding: 40px 48px; border-radius: 12px; background: #151517; box-shadow: 0 0 0 1px #2a2a2d;
            font-size: 36px; line-height: 1.45; min-height: 220px; box-sizing: border-box; }
  .prompt small { display: block; font-size: 22px; color: #8a8a90; margin-bottom: 18px; }
  .chat { position: absolute; width: 560px; padding: 22px 26px; border-radius: 12px; background: #161618; box-shadow: 0 0 0 1px #2e2e32, 0 18px 50px rgba(0,0,0,.55);
          font-size: 22px; line-height: 1.4; box-sizing: border-box; opacity: 0; }
  .chat .head { font-size: 16px; color: #8a8a90; margin-bottom: 14px; letter-spacing: .02em; }
  .chat .msg { margin-top: 12px; opacity: 0; }
  .chat .msg b { display: block; font-size: 16px; font-weight: 500; color: #8a8a90; margin-bottom: 4px; }
  .chat .msg.ai span { color: #c9c9ce; }
  .toast { position: absolute; transform: translateX(-50%); padding: 12px 22px 12px 18px; border-radius: 999px; background: #161618; box-shadow: 0 0 0 1px #2e2e32, 0 12px 36px rgba(0,0,0,.5);
           font-size: 24px; font-weight: 500; white-space: nowrap; opacity: 0; display: flex; align-items: center; gap: 12px; }
  .toast.big { font-size: 44px; font-weight: 600; padding: 22px 40px 22px 26px; gap: 22px; box-shadow: 0 0 0 2px var(--c), 0 20px 60px rgba(0,0,0,.6); }
  .toast.big i { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 28px; color: #fff; }
  .hook { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hook .bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(3px) brightness(.32); transform: scale(1.06); }
  .hook .w { position: relative; font-size: 104px; font-weight: 650; letter-spacing: -0.035em; line-height: 1.08; opacity: 0; }
  .hook .w.dim { color: #8a8a90; }
  .endcard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .endcard .bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.22) blur(2px); }
  .endcard > :not(.bg) { position: relative; }
  .endcard img.icon { width: 190px; height: 190px; }
  .endcard h1 { font-size: 128px; font-weight: 650; letter-spacing: -0.035em; margin: 30px 0 0; }
  .endcard p { font-size: 40px; color: #c4c4c9; margin: 16px 0 0; }
  .endcard .links { display: flex; gap: 40px; margin-top: 54px; font-family: "DejaVu Sans Mono", monospace; font-size: 28px; color: #e2e2e6; }
  .toast i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .beat { position: absolute; left: 160px; top: 966px; font-size: 22px; color: #8a8a90; letter-spacing: .01em; }
  .imgcard { position: absolute; left: 260px; top: 120px; width: 1400px; padding: 30px 34px; border-radius: 14px; background: #f7f7f5; box-shadow: 0 0 0 1px #2a2a2d; box-sizing: border-box; }
  .imgcard small { display: block; font-size: 20px; color: #55555a; margin-bottom: 14px; font-family: "DejaVu Sans Mono", monospace; }
  .imgcard img { display: block; width: 100%; }
  .caret { display: inline-block; width: 3px; height: 38px; background: #ededed; vertical-align: -6px; margin-left: 2px; }
</style>
<div id="stage"><div id="layers"></div><div id="caption"></div><div id="speed"></div></div>
<script>
  let T = null; const layers = [];
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const FADE = 0.35;
  // the photograph that was on screen at footage time t (the last one taken at or before t)
  const frameAt = (frames, t) => { let lo = 0, hi = frames.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (frames[m].t <= t) lo = m; else hi = m - 1; } return frames[lo].file; };
  window.load = (timeline) => {
    T = timeline; const root = document.getElementById('layers');
    for (const s of T.scenes) {
      const el = document.createElement('div'); el.className = 'layer' + (s.kind === 'footage' ? '' : ' card'); root.appendChild(el);
      const L = { s, el, imgs: [] };
      if (s.kind === 'footage') for (const w of s.windows) {
        const box = document.createElement('div'); box.className = 'win'; box.style.cssText = `left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px`;
        const img = new Image(); if (w.zoom) { img.style.transformOrigin = `${w.zoom.x * 100}% ${w.zoom.y * 100}%`; img.style.transform = `scale(${w.zoom.s})`; } box.appendChild(img); el.appendChild(box); L.imgs.push({ img, w, src: '', box });
        if (w.chat) { const c = document.createElement('div'); c.className = 'chat'; c.style.cssText = `left:${w.x + w.chat.x}px;top:${w.y + w.chat.y}px`;
          c.innerHTML = `<div class="head">${w.chat.head}</div>` + w.chat.lines.map((l) => `<div class="msg${l.ai ? ' ai' : ''}"><b>${l.who}</b><span></span></div>`).join('');
          el.appendChild(c); L.chat = { el: c, w }; }
        for (const t of w.toasts || []) { const d = document.createElement('div'); d.className = 'toast' + (t.big ? ' big' : ''); d.style.left = (w.x + w.w / 2) + 'px'; d.style.top = (w.y + (t.big ? 340 : 64)) + 'px';
          d.style.setProperty('--c', t.color); d.innerHTML = `<i style="background:${t.color}">${t.big ? t.initial || '' : ''}</i>${t.text}`; el.appendChild(d); (L.toasts = L.toasts || []).push({ d, t }); }
        if (w.label) { const who = document.createElement('div'); who.className = 'who'; who.style.left = w.x + 'px'; who.style.top = Math.max(8, w.y - 42) + 'px'; who.textContent = w.label; el.appendChild(who); }
      } else if (s.kind === 'hook') {
        el.classList.remove('card'); el.innerHTML = `<div class="hook"><div class="bg" style="background-image:url('${s.bg}')"></div>` + s.words.map((w) => `<div class="w${w.dim ? ' dim' : ''}">${w.text}</div>`).join('') + `</div>`;
      } else if (s.kind === 'end') {
        el.classList.remove('card'); el.innerHTML = `<div class="endcard">${s.bg ? `<div class="bg" style="background-image:url('${s.bg}')"></div>` : ''}<img class="icon" src="${T.icon}"><h1>${s.title}</h1>${s.sub ? `<p>${s.sub}</p>` : ''}<div class="links">${s.links.map((l) => `<span>${l}</span>`).join('')}</div></div>`;
      } else if (s.kind === 'title') {
        el.innerHTML = `<img class="icon" src="${T.icon}"><h1>${s.title}</h1>${s.sub ? `<p>${s.sub}</p>` : ''}` + (s.code ? `<code>${s.code}</code>` : '');
      } else if (s.kind === 'image') {
        el.classList.remove('card'); el.innerHTML = `<div class="imgcard"><small>${s.label}</small><img src="${s.src}"></div>`;
      } else if (s.kind === 'prompt') {
        el.classList.remove('card'); el.innerHTML = `<div class="prompt"><small>${s.label}</small><span class="typed"></span><span class="caret"></span></div>`;
      }
      layers.push(L);
    }
    return T.length;
  };
  window.seek = async (t) => {
    const waits = []; let caption = '', capA = 0, speed = '', spA = 0;
    for (const L of layers) {
      const s = L.s, local = t - s.start; const on = local >= 0 && local < s.length;
      const a = on ? clamp(Math.min(s.cutIn ? 1 : local / FADE, s.cutOut ? 1 : (s.length - local) / FADE), 0, 1) : 0; L.el.style.opacity = a;
      if (!on) continue;
      if (s.kind === 'footage') {
        const ft = s.from + local * s.speed;      // footage time
        for (const I of L.imgs) { if (I.w.from) { const k = clamp(local / (I.w.tween || 0.6), 0, 1), e = k * k * (3 - 2 * k), g = (n) => I.w.from[n] + (I.w[n] - I.w.from[n]) * e;
            I.box.style.left = g('x') + 'px'; I.box.style.top = g('y') + 'px'; I.box.style.width = g('w') + 'px'; I.box.style.height = g('h') + 'px'; }
          const src = I.w.dir + '/' + frameAt(I.w.frames, ft); if (src !== I.src) { I.src = src; I.img.src = src; waits.push(I.img.decode().catch(() => {})); } }
        for (const c of s.captions || []) if (local >= c.at && local < c.until) {
          const fin = s.cutIn && c.at === 0 ? 1 : (local - c.at) / 0.25, fout = s.cutOut && c.until >= s.length ? 1 : (c.until - local) / 0.25;
          caption = c.text; capA = clamp(Math.min(fin, fout), 0, 1) * a;
        }
        for (const T of L.toasts || []) { const k = local - T.t.at, hold = T.t.hold || 2.2; const o = k < 0 ? 0 : k < 0.25 ? k / 0.25 : k < hold ? 1 : k < hold + 0.4 ? (hold + 0.4 - k) / 0.4 : 0;
          T.d.style.opacity = o; T.d.style.marginTop = ((1 - Math.min(1, k / 0.25)) * -14) + 'px'; if (T.t.big) T.d.style.transform = `translateX(-50%) scale(${0.85 + 0.15 * Math.min(1, Math.max(0, k) / 0.3)})`; }
        if (L.chat) { const C = L.chat.w.chat, ca = clamp(Math.min((local - C.at) / 0.3, (C.until - local) / 0.3), 0, 1); L.chat.el.style.opacity = ca;
          L.chat.el.querySelectorAll('.msg').forEach((m, i) => { const l = C.lines[i], k = local - l.at; m.style.opacity = k > 0 ? 1 : 0;
            const n = l.typing ? Math.round(clamp(k / l.typing, 0, 1) * l.text.length) : (k > 0 ? l.text.length : 0); m.querySelector('span').textContent = l.text.slice(0, n); }); }
        
      } else if (s.kind === 'hook') {
        L.el.querySelectorAll('.w').forEach((w, i) => { const k = local - s.words[i].at; w.style.opacity = clamp(k / 0.18, 0, 1); w.style.transform = `translateY(${(1 - clamp(k / 0.25, 0, 1)) * 26}px) scale(${1 + (1 - clamp(k / 0.25, 0, 1)) * 0.06})`; });
      } else if (s.kind === 'prompt') {
        const n = Math.round(clamp((local - 0.4) / s.typing, 0, 1) * s.text.length);
        L.el.querySelector('.typed').textContent = s.text.slice(0, n);
        L.el.querySelector('.caret').style.opacity = n >= s.text.length ? (Math.floor(local * 2) % 2 ? 0 : 1) : 1;
      }
    }
    const cap = document.getElementById('caption'), sp = document.getElementById('speed');
    cap.textContent = caption; cap.style.opacity = capA; sp.textContent = speed; sp.style.opacity = spA;
    await Promise.all(waits); await document.fonts.ready;
  };
</script>
